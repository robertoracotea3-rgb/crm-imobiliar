<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F1F4F8">
<title>Semnare document · Kira Imobiliare</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F1F4F8;--surface:#FFFFFF;--ink:#16202C;--muted:#5B6878;--line:#D8DEE6;
  --accent:#1D4ED8;--accent-ink:#FFFFFF;--good:#0F7A4B;--good-bg:#E3F4EB;--bad:#B42318;--bad-bg:#FDECEA;--warn-bg:#FFF4DC;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px}
.top img{width:34px;height:34px;border-radius:9px;background:#000;flex:none}
.top b{font-size:16px;letter-spacing:.01em}
.top span{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px}
.card h1{font-size:22px;line-height:1.25;margin:0 0 8px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.card.good{border-color:#B7E2CB;background:var(--good-bg)}
.card.bad{border-color:#F4C7C2;background:var(--bad-bg)}
.small{font-size:14px;color:var(--muted)}
.steps{margin:6px 0 12px;padding-left:22px}
.steps li{margin:3px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
.btn:focus-visible{outline:3px solid #93B4F8;outline-offset:2px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.loading{display:flex;align-items:center;gap:12px}
.doc-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 2px -6px}
.kd{max-width:none}
.kd-sf{max-width:none}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px}
@media (max-width:560px){
  .card{padding:16px 14px 18px}
  .card h1{font-size:20px}
  .row .btn{flex:1 1 100%}
  .kd{padding:18px 14px 22px!important;font-size:14px!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="icon-192.png" alt=""><b>Kira Imobiliare</b><span>Semnare electronică</span></header>
  <main id="app" aria-live="polite">
    <div class="card loading"><div class="spin" aria-hidden="true"></div><p>Se deschide documentul…</p></div>
  </main>
  <p class="foot">Pagina nu folosește cookie-uri. Linkul este personal: nu îl trimiteți altor persoane.</p>
</div>
<noscript><p style="text-align:center">Pentru semnare, activați JavaScript în browser.</p></noscript>
<script>/* Kira Imobiliare: documentele (contracte, fișe) afișate pe ecran și în PDF, semnătura desenată
   cu degetul sau cu mouse-ul și amprenta SHA-256 a textului semnat.
   Același fișier e folosit de CRM (PC și telefon) și de pagina de semnare (semnare.html).
   Documentul e un JSON cu blocuri de text; textul exact (șirul JSON) e cel semnat și cel din amprentă. */
(function(){
'use strict';

/* ---------------- dates, devices, phones ---------------- */
const TZ = 'Europe/Bucharest';
function fmtWhen(ms, secs){
  const d = new Date(+ms);
  if (!ms || isNaN(d)) return '';
  try {
    const o = {timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'};
    if (secs) o.second = '2-digit';
    const p = {};
    new Intl.DateTimeFormat('ro-RO', o).formatToParts(d).forEach(x => { p[x.type] = x.value; });
    return p.day + '.' + p.month + '.' + p.year + ', ' + p.hour + ':' + p.minute + (secs ? ':' + p.second : '');
  } catch(e){
    const z = n => String(n).padStart(2, '0');
    return z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + z(d.getHours()) + ':' + z(d.getMinutes()) + (secs ? ':' + z(d.getSeconds()) : '');
  }
}
const fmtDay = ms => (fmtWhen(ms) || '').split(',')[0];
function uaShort(ua){
  ua = String(ua || '');
  const dev = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && /Mobile\//.test(ua)) ? 'iPad' : /Android/.test(ua) ? 'Android' :
    /Windows/.test(ua) ? 'Windows' : /Mac OS X|Macintosh/.test(ua) ? 'Mac' : /CrOS/.test(ua) ? 'ChromeOS' : /Linux/.test(ua) ? 'Linux' : '';
  let br = /EdgA?\/|EdgiOS/.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /OPR\/|OPiOS/.test(ua) ? 'Opera' : /Firefox|FxiOS/.test(ua) ? 'Firefox' :
    /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  if (/; wv\)|FBAN|FBAV|Instagram|WhatsApp/.test(ua)) br = br ? br + ' (deschis din aplicație)' : 'browserul unei aplicații';
  return [dev, br].filter(Boolean).join(' · ') || ua.slice(0, 90);
}
// A phone number for wa.me: digits with the country code (07xx… becomes 407xx…).
function waPhone(t){
  let d = String(t || '').replace(/[^\d+]/g, '');
  if (d.charAt(0) === '+') d = d.slice(1);
  else if (d.slice(0, 2) === '00') d = d.slice(2);
  else if (/^0\d{9}$/.test(d)) d = '4' + d;
  d = d.replace(/\D/g, '');
  return d.length >= 9 && d.length <= 15 ? d : '';
}
const IMG_RE = /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/]+={0,2}$/;
const isImg = s => typeof s === 'string' && s.length < 700000 && IMG_RE.test(s);
function parseDoc(t){
  let d = null;
  try { d = JSON.parse(String(t)); } catch(e){ return null; }
  return d && typeof d === 'object' && d.v === 1 && Array.isArray(d.blocks) ? d : null;
}

/* ---------------- SHA-256 (the browser's own when available) ---------------- */
const K256 = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256Bytes(msg){
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = msg.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(msg); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 536870912));
  const w = new Uint32Array(64);
  const r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let off = 0; off < n; off += 64){
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++){
      const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++){
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K256[i] + w[i]) >>> 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer);
  H.forEach((v, i) => ov.setUint32(i * 4, v));

}
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
async function sha256(text){
  const b = new TextEncoder().encode(String(text));
  try { if (window.crypto && crypto.subtle) return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', b))); } catch(e){}
  return hex(sha256Bytes(b));
}

/* ---------------- what goes next to the signatures and in the signing certificate ---------------- */
function sigCols(doc, o){
  const a = doc.agencySig || {}, s = o && o.sign || null, c = doc.client || {};
  const left = {head: 'AGENȚIA', lines: [{x: a.firm || 'Agenția', b: true}], img: isImg(a.img) ? 'A' : '', after: []};
  if (a.name) left.lines.push({x: 'prin ' + a.name + (a.role ? ', ' + a.role : '')});
  left.after.push(a.at ? 'Semnat electronic la ' + fmtWhen(a.at) : 'Semnătura Agenției se aplică la trimiterea documentului.');
  const right = {head: 'CLIENTUL', lines: [{x: (s && s.name) || c.name || 'Clientul', b: true}], img: s && isImg(s.img) ? 'C' : '', after: []};
  if (c.rep) right.lines.push({x: c.rep});
  if (s){
    right.after.push('Semnat electronic la ' + fmtWhen(s.at, true));
    if (s.method === 'dispozitiv') right.after.push('pe dispozitivul Agenției, în prezența reprezentantului ei');
    else if (s.ip) right.after.push('Adresa IP ' + s.ip);
    (doc.questions || []).forEach(q => {
      const v = s.answers && s.answers[q.k];
      if (v && v.v) right.after.push((q.short || q.x) + ': ' + v.v + (v.det ? ' (' + v.det + ')' : ''));
    });
  } else right.after.push('Clientul semnează electronic: bifează acordurile, își scrie numele și desenează semnătura.');
  return [left, right];
}
function certBlocks(doc, s, ev){
  ev = ev || {};
  const a = doc.agencySig || {};
  const rows = [
    ['Document', (doc.title || 'Document') + (doc.no ? ' nr. ' + doc.no : '') + (doc.subtitle ? ', ' + doc.subtitle : '')],
    ['Amprenta digitală SHA-256 a textului semnat', s.hash || ''],
    ['Agenția', [a.firm, a.name ? 'prin ' + a.name + (a.role ? ', ' + a.role : '') : '', a.at ? 'semnat la ' + fmtWhen(a.at, true) : ''].filter(Boolean).join(', ')]
  ];
  if (ev.sentAt) rows.push(['Trimis Clientului spre semnare', fmtWhen(ev.sentAt, true) + (ev.via ? ', ' + ev.via : '')]);
  if (ev.opened) rows.push(['Deschis de Client', 'prima dată la ' + fmtWhen(ev.opened, true) + (ev.opens > 1 ? '; deschis de ' + ev.opens + ' ori în total' : '')]);
  rows.push(['Semnat de Client', (s.name || '') + ', la ' + fmtWhen(s.at, true) + ' (ora României)']);
  rows.push(['Cum a semnat', s.method === 'dispozitiv'
    ? 'pe dispozitivul Agenției, în prezența ' + (s.agent ? 'reprezentantului ' + s.agent : 'reprezentantului Agenției') + ': a citit documentul, a bifat acordurile, și-a scris numele și și-a desenat semnătura'
    : 'pe pagina de semnare deschisă din linkul personal primit: a citit documentul, a bifat acordurile, și-a scris numele și și-a desenat semnătura']);
  if (s.ip) rows.push(['Adresa IP', s.ip]);
  if (s.ua) rows.push(['Dispozitiv și browser', uaShort(s.ua)]);
  rows.push(['Tipul semnăturii', 'semnătură electronică, în sensul Regulamentului (UE) nr. 910/2014 (eIDAS) și al Legii nr. 214/2024']);
  const cons = (doc.consents || []).map(c => [s.consents && s.consents[c.k] ? 'Bifat' : 'Nebifat' + (c.req ? '' : ' (opțional)'), c.x]);
  const out = [{t: 'pb'}, {t: 'title', x: 'CERTIFICAT DE SEMNARE ELECTRONICĂ', sub: 'pentru ' + (doc.short || 'documentul') + (doc.no ? ' nr. ' + doc.no : '')},
    {t: 'kv', rows: rows}, {t: 'h', x: 'Acordurile exprimate de Client la semnare'}, {t: 'kv', rows: cons, kw: 0.2}];
  const ans = (doc.questions || []).map(q => { const v = s.answers && s.answers[q.k]; return [q.x, v && v.v ? v.v + (v.det ? '. ' + v.det : '') : 'fără răspuns']; });
  if (ans.length) out.push({t: 'h', x: 'Răspunsurile Clientului'}, {t: 'kv', rows: ans});
  out.push({t: 'note', x: 'Certificatul este generat de aplicația Kira Imobiliare din înregistrările făcute la semnare. Amprenta SHA-256 se calculează din textul exact al documentului semnat: orice modificare ulterioară a textului ar produce o altă amprentă.'});
  return out;
}

/* ---------------- on screen ---------------- */
const CSS =
  '.kd{background:#fff;color:#1b2129;font:14.5px/1.58 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:26px 28px 30px;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.08),0 8px 28px rgba(16,24,40,.08);max-width:780px;margin:0 auto;text-align:left;color-scheme:light}' +
  '.kd *{box-sizing:border-box}' +
  '.kd-brand{font-size:11px;font-weight:700;letter-spacing:.03em;color:#1b3a5c;border-bottom:1px solid #d8dee6;padding-bottom:8px;margin-bottom:20px}' +
  '.kd-title{font-size:21px;line-height:1.25;margin:4px 0 4px;text-align:center;color:#1b3a5c;font-weight:800}' +

  '.kd-meta{font-size:13.5px;margin:0 0 6px;color:#1b2129}' +
  '.kd-h{font-size:16.5px;line-height:1.3;color:#1b3a5c;margin:20px 0 7px;font-weight:800}' +

  '.kd-p b{color:#111827}' +
  '.kd-li{margin:0 0 6px;padding-left:18px;position:relative}.kd-li::before{content:"•";position:absolute;left:5px}' +

  '.kd-sf *{box-sizing:border-box}' +
  '.kd-sf h2{font-size:19px;line-height:1.3;margin:0 0 4px;color:#1b3a5c;font-weight:800}' +

    var t = docTitle(doc);
    t = t.charAt(0).toLocaleLowerCase('ro-RO') + t.slice(1);
    return t.replace(/^contract(?=\s|$)/, 'contractul').replace(/^fișă(?=\s|$)/, 'fișa');
  }
  function cap(s){ return s.charAt(0).toLocaleUpperCase('ro-RO') + s.slice(1); }

  /* ---------- the states of the link ---------- */
  function showState(r){
    var s = r && r.status;
    if (s === 'cancelled') return message('bad', 'Linkul a fost oprit de Agenție', ['Agenția a oprit acest link, de exemplu pentru o corectură. Dacă e cazul, veți primi un link nou.']);
    if (s === 'expired') return message('bad', 'Linkul a expirat', ['Termenul pentru semnare a trecut' + (r.expiresAt ? ' (' + KD.fmtDay(r.expiresAt) + ')' : '') + '. Cereți Agenției un link nou.']);
    if (s === 'signed_old') return message('good', 'Documentul a fost semnat', ['Documentul a fost semnat. Copia semnată nu se mai poate descărca din acest link; o puteți cere Agenției.']);
    return message('bad', 'Linkul nu mai este valabil', ['Linkul nu este valid sau a fost înlocuit cu unul nou. Folosiți ultimul link primit de la Agenție.']);
  }

  async function start(){
    urls.forEach(function(u){ try { URL.revokeObjectURL(u); } catch(e){} }); urls = [];
    if (!KD) return message('bad', 'Pagina nu s-a încărcat complet', ['Reîncărcați pagina.'], retryRow());
    var L = readLink();
    if (!L) return message('bad', 'Link incomplet', ['Deschideți linkul exact cum l-ați primit pe WhatsApp sau pe email (tot textul, până la capăt). Dacă tot nu merge, cereți Agenției un link nou.']);
    show([el('div', 'card loading')]);
    app.firstChild.appendChild(el('div', 'spin')); app.firstChild.appendChild(el('p', null, 'Se deschide documentul…'));
    var r;
    try { r = await rpc(L, 'crm_sign_get', {p_token: L.token}); }
    catch(e){ return message('bad', 'Documentul nu s-a putut deschide', [e.message], retryRow()); }
    if (!r || (r.status !== 'sent' && r.status !== 'signed')) return showState(r);
    var doc = KD.parseDoc(r.doc), ok = false;
    try { ok = !!doc && (await KD.sha256(r.doc)) === r.hash; } catch(e){ ok = false; }
    if (!ok) return message('bad', 'Documentul nu a putut fi verificat', ['Amprenta documentului nu corespunde. Nu semnați; anunțați Agenția.']);
    if (r.status === 'signed' && r.patch && r.patch.sign) return showSigned(doc, r, r.patch, false);
    showSign(L, doc, r);
  }

  function showSign(L, doc, r){
    var firm = (doc.agencySig && doc.agencySig.firm) || '';
    var who = (doc.client && doc.client.name) || '';
    var intro = card('', 'Semnați ' + shortName(doc), [
      who ? para(['Bună ziua, ', [who], '!']) : null,
      para([['Kira Imobiliare'], firm ? ' (' + firm + ')' : '', ' v-a trimis spre semnare ' + theTitle(doc) + (doc.subtitle ? ', ' + doc.subtitle : '') + '.']),
      (function(){ var o = el('ol', 'steps'); ['Citiți documentul de mai jos. Îl puteți și descărca.', 'La final, bifați acordurile, scrieți-vă numele și semnați cu degetul sau cu mouse-ul.', 'Apăsați „Semnez”, apoi descărcați copia semnată.'].forEach(function(t){ o.appendChild(el('li', null, t)); }); return o; })(),
      el('p', 'small', (r.expiresAt ? 'Linkul este valabil până la ' + KD.fmtDay(r.expiresAt) + '. ' : '') + 'Dacă observați o greșeală, nu semnați: cereți Agenției corectarea.')
    ]);
    var row = el('div', 'row'), go = el('button', 'btn primary', 'Mergi la semnare');
    go.type = 'button';
    row.appendChild(go); row.appendChild(pdfButton(doc, {}, 'Descarcă documentul (PDF)', who, false));
    intro.appendChild(row);
    var lab = el('div', 'doc-label', 'Documentul');
    var docHost = el('div');
    var sfHost = el('div');
    show([intro, lab, docHost, sfHost]);
    KD.render(doc, docHost, {});
    var form = KD.signForm(sfHost, doc, {
      title: 'Semnarea',
      submit: 'Semnez',
      busy: 'Se semnează…',
      note: 'Când apăsați „Semnez”, semnătura se aplică pe documentul de mai sus. Se înregistrează data și ora, adresa IP și browserul folosit, ca dovadă a semnării.',
      onSubmit: async function(v){
        var res = await rpc(L, 'crm_sign_submit', {p_token: L.token, p_hash: r.hash, p_name: v.name, p_consents: v.consents, p_answers: v.answers, p_img: v.img, p_ua: String(navigator.userAgent || '').slice(0, 400)});
        if (res && res.status === 'signed' && res.patch && res.patch.sign){ showSigned(doc, r, res.patch, true); return; }
        if (res && res.status === 'changed') throw new Error('Agenția a modificat documentul între timp. Reîncărcați pagina și citiți varianta nouă.');
        showState(res);
      }
    });
    go.addEventListener('click', function(){ try { form.el.scrollIntoView({behavior: 'smooth', block: 'start'}); } catch(e){ form.el.scrollIntoView(); } });
  }

  function showSigned(doc, r, patch, fresh){
    var s = patch.sign, op = patch.opened || {};
    var ev = {sentAt: r.sentAt, opened: op.first, opens: op.count};
    var c = card('good', fresh ? 'Gata, ați semnat!' : 'Documentul este semnat', [
      para([cap(theTitle(doc)) + ' a fost semnat' + (doc.short === 'fișa' ? 'ă' : '') + ' de ', [s.name || ''], ' la ' + KD.fmtWhen(s.at, true) + '.']),
      el('p', null, 'Agenția primește automat documentul semnat. Descărcați și păstrați copia dumneavoastră: are la final certificatul de semnare (data și ora, adresa IP, amprenta documentului).'),
      el('p', 'small', 'Copia semnată se poate descărca din acest link timp de 30 de zile.')
    ]);
    var row = el('div', 'row');
    row.appendChild(pdfButton(doc, {sign: s, ev: ev}, 'Descarcă PDF-ul semnat', s.name, true));
    c.appendChild(row);
    var docHost = el('div');
    show([c, el('div', 'doc-label', 'Documentul semnat'), docHost]);
    KD.render(doc, docHost, {sign: s, ev: ev});
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', start);
  start();
})();
</script>
</body>
</html>
